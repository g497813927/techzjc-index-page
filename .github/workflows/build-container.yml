name: Docker Build & Push and Deploy to Alibaba Cloud FC

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  BLOG_CONTENT_REPOSITORY: g497813927/techzjc-blog-content
  BLOG_CONTENT_REF: main

concurrency:
  group: build-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Package checks
    runs-on: ubuntu-latest
    outputs:
      blog_content_revision: ${{ steps.resolve_blog_content.outputs.revision }}
    permissions:
      contents: read

    steps:
      - name: Resolve Blog Content revision
        id: resolve_blog_content
        env:
          GH_TOKEN: ${{ secrets.BLOG_CONTENT_SYNC_PAT }}
        run: |
          set -euo pipefail
          actual_revision="$(gh api --method GET "repos/$BLOG_CONTENT_REPOSITORY/commits/$BLOG_CONTENT_REF" --jq .sha)"
          if [[ ! "$actual_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid resolved Blog Content revision::$actual_revision"
            exit 1
          fi
          echo "revision=$actual_revision" >> "$GITHUB_OUTPUT"
          {
            echo "### Resolved Blog Content input"
            printf -- '- Repository: `%s`\n' "$BLOG_CONTENT_REPOSITORY"
            printf -- '- Source ref: `%s`\n' "$BLOG_CONTENT_REF"
            printf -- '- Blog revision: `%s`\n' "$actual_revision"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Blog Content to content/blog
        run: mkdir -p content

      - name: Sync Blog Content
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BLOG_CONTENT_REPOSITORY }}
          path: content/blog
          token: ${{ secrets.BLOG_CONTENT_SYNC_PAT }}
          ref: ${{ steps.resolve_blog_content.outputs.revision }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Blog Content revision
        env:
          BLOG_CONTENT_REVISION: ${{ steps.resolve_blog_content.outputs.revision }}
        run: |
          actual_revision="$(git -C content/blog rev-parse HEAD)"
          if [[ "$actual_revision" != "$BLOG_CONTENT_REVISION" ]]; then
            echo "::error title=Blog Content revision mismatch::Expected $BLOG_CONTENT_REVISION, got $actual_revision"
            exit 1
          fi
          {
            echo "### Checked build inputs"
            printf -- '- Site revision: `%s`\n' "$GITHUB_SHA"
            printf -- '- Blog revision: `%s`\n' "$actual_revision"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

  build:
    needs: checks
    name: Build and Push Docker Image (amd64)
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.docker_build.outputs.digest }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Prepare Blog Content to content/blog
        run: mkdir -p content
      
      - name: Sync Blog Content
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BLOG_CONTENT_REPOSITORY }}
          path: content/blog
          token: ${{ secrets.BLOG_CONTENT_SYNC_PAT }}
          ref: ${{ needs.checks.outputs.blog_content_revision }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and record Blog Content revision
        id: built_blog_content
        env:
          BLOG_CONTENT_REVISION: ${{ needs.checks.outputs.blog_content_revision }}
        run: |
          actual_revision="$(git -C content/blog rev-parse HEAD)"
          if [[ "$actual_revision" != "$BLOG_CONTENT_REVISION" ]]; then
            echo "::error title=Blog Content revision mismatch::Expected $BLOG_CONTENT_REVISION, got $actual_revision"
            exit 1
          fi
          echo "revision=$actual_revision" >> "$GITHUB_OUTPUT"
          {
            echo "### Docker build inputs"
            printf -- '- Site revision: `%s`\n' "$GITHUB_SHA"
            printf -- '- Blog revision: `%s`\n' "$actual_revision"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image on non-protected refs
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.techzjc.blog.revision=${{ steps.built_blog_content.outputs.revision }}
          build-args: |
            NEXT_PUBLIC_SENTRY_APPLICATION_KEY=techzjc-site-index
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_UPLOAD_SOURCEMAPS=false
          push: false

      - name: Build and push images on Main
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        id: docker_build
        with:
          context: .
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.techzjc.blog.revision=${{ steps.built_blog_content.outputs.revision }}
          build-args: |
            NEXT_PUBLIC_SENTRY_APPLICATION_KEY=techzjc-site-index
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_UPLOAD_SOURCEMAPS=true
          push: true
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ${{ vars.IMAGE }}:${{ github.sha }}-${{ steps.built_blog_content.outputs.revision }}
            ${{ vars.IMAGE }}:${{ github.sha }}
            ${{ vars.IMAGE }}:latest
  deploy:
    needs:
      - checks
      - build
    if: github.ref == 'refs/heads/main'
    name: Deploy to Alibaba Cloud FC
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Serverless Devs
        run: npm install -g @serverless-devs/s

      - name: Deploy to Alibaba Cloud FC
        env:
          REGION: ${{ vars.REGION }}
          FC_NAME: ${{ vars.FC_NAME }}
          IMAGE_FULL: "${{ vars.IMAGE }}@${{ needs.build.outputs.digest }}"
          CDN_ORIGIN_AUTH: ${{ secrets.CDN_ORIGIN_AUTH }}
          default_serverless_devs_key: "{\"AccountID\":\"${{ secrets.ALIYUN_ACCOUNT_ID }}\",\"AccessKeyID\":\"${{ secrets.ALIYUN_ACCESS_KEY_ID }}\",\"AccessKeySecret\":\"${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}\"}"
        run: |
          s deploy -t s.yaml --use-local -y
